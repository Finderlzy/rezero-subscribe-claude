# 读者反馈（需求 v0.16，FR-118–FR-125；术语见 CONTEXT.md：读者反馈、反馈截图、精选）。
#
# 这个文件是读者反馈的唯一来源：截图放进 src/assets/feedback/，再在这里登记一条，重新构建就会出现在
# /feedback/ 和首页的“读者反馈”里。它不是从重写稿导入的正文（ADR-0005 不适用），也不进 docs/v3-rewrite/。
#
# 一张截图的字段：
#   image     必填，src/assets/feedback/ 下的文件名（png、jpg、webp）。文件名用小写英文和连字符。
#   alt       必填，截图里写了什么，不超过 80 个字符。页面上不显示，给读屏和图片加载失败时用。
#   featured  可选，写 true 就上首页精选，最多 6 张。
#
# 写法：页面按这里的顺序排，新的写最上面。截图原样放（不打码昵称和头像，作者负责征得读者同意），
# 但不能出现服务器 IP、节点链接、面板账号和密码（AGENTS.md「安全」）。
# 截图不存在、同一张登记两次、目录里有截图没登记、featured 超过 6 张，构建都会失败。

