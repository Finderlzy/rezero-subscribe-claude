# 更新日志（需求 v0.13，FR-80–FR-86；术语见 CONTEXT.md：更新日志、更新条目、更新类型、置顶）。
#
# 这个文件是更新日志条目的唯一来源：改这里、重新构建就会出现在 /update-log/ 和首页的“最近更新”里。
# 它不是从重写稿导入的正文（ADR-0005 不适用），也不进 docs/v3-rewrite/。
#
# 一条更新的四个必填字段：
#   date    发布日期，YYYY-MM-DD；不能写晚于构建当天的日期（不能预约发布）。同一分类里按日期倒序。
#   type    更新类型：notice = 公告（须知类，如群号变更、商家失效）
#                      content = 内容（正文改动，如新增某节的视频、加了一个常见问题）
#                      site    = 站点（引导站本身的改动，如新增模块、修样式）
#   title   一句话标题，不超过 40 个字符。写清楚“什么变了”，例如“方案一新增 SSH 连接录屏”。
#   body    一条更新的内容，不超过 200 个字符。说清读者要做什么或有什么影响。
# 可选字段：
#   page    被改动的页面标识（例如 plan1、client-desktop、maintenance）；写了就显示成指向该页的链接。
#           必须是路线图里的页面，写错构建失败。
#   pinned  只有公告能写 true：在「全部」和「公告」两个分类里排在最前面。
#
# 写法：新条目写在最上面（同一天的条目按这里的顺序排，构建不强制顺序）。标题和内容都是给人看的一句话，
# 不写多段正文、图片和代码块。更新日志是用来告诉读者“哪里变了”的，不是第二份教程。

