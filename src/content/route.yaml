# 路线图：章节、分叉点、页面顺序和旁支页的唯一来源（架构 §3 M1/M2、需求 §5.2）。
# 页面标识是 principle/<id>.md 的文件名，也是 URL /<id>/；v2.0 发布后不能改（ADR-0002）。
# 章节的 intro 是标题卡下的一句话（design §4.1）：必须原样摘自这一章第一页的原理版正文，构建时核对（ADR-0005）。
# 没有默认路线：分叉点没选时，它的分支段两侧的页面指向它的选择页（FR-13）。
chapters:
  - id: start
    title: 开始
    intro: 每一步我都会努力去讲清楚为什么要这么做，这样就算哪天某个细节失效了，你也知道该往哪个方向去调，请多包涵。
    items: [preface, disclaimer, overview, clean-up]
  - id: node-and-ip
    title: 准备节点和住宅 IP
    intro: 三个方案的目的都一样：让 claude 看到一个静态住宅 IP，而且只有你自己在用。
    items:
      - { choose: node-plan, page: choose-plan }
      - branch: node-plan
        options:
          plan-1: [plan1-free-isp, plan1-buy-server, plan1-buy-isp, plan1-make-node, plan1-panel]
          plan-2: [plan2-residential-server]
          plan-3: [plan3-residential-node]
      # F1 的汇合点
      - import-proxy
      - check-ip
      # 原理独有，操作视图绕过
      - recap
      - leak-protection
      - timezone
  - id: register-and-subscribe
    title: 注册和订阅
    intro: 所以手机也是 claude 会看到的一台设备。
    items:
      - { choose: phone, page: choose-phone }
      - branch: phone
        options:
          iphone: [iphone-app-store-austria, iphone-proxy, iphone-gmail]
          android: [android-proxy, android-google-play, android-gmail]
      # F2 第一段的汇合点
      - register-gmail
      - chrome-sign-in
      - use-two-days
      - google-region
      - register-claude
      - subscribe
      # 同一分叉点的第二段，没有选择页；没选时“订阅”的下一步是“选择手机系统”
      - branch: phone
        options:
          iphone: [iphone-why-us-apple-id, iphone-apple-id, iphone-app-store-login, iphone-gift-card, iphone-subscribe, iphone-purchase-failed]
          android: [android-subscribe]
      # F2 订阅段的汇合点
      - after-subscribe
  - id: ending
    title: 结尾
    intro: 也感谢所有我没能记住名字、但确实帮到我的人。
    items: [thanks, afterword]
  # 后记的下一步；常见问题和 IP 质量实测合集是参考页，从这一页进去
  - id: appendix
    title: 附录
    intro: 卡住了再来查，不看也能照着正文做完。
    items: [appendix]
# 旁支页：不在序列里，页脚是“回到：<returnTo>”和 returnTo 的下一步（FR-19）
side:
  google-appeal: { returnTo: use-two-days }
