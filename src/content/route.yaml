# 路线图：章节、分叉点和步骤顺序的唯一来源（架构 §3 M1、需求 §5.2）。
# 步骤标识是 steps/<id>.md 的文件名，也是 URL；已发布的标识不能改（ADR-0002）。
# 目前迁入了“开始”到“五、检查 IP 质量”；清理 Claude Code 配置和后面的章节、分叉点由后续迁移任务补上。
defaults: { node-plan: plan-1, desktop-proxy: v2rayn }
chapters:
  - id: start
    title: 开始
    items: [before-you-start, overview]
  - id: residential-ip
    title: 一、准备住宅 IP
    items:
      - choose: node-plan
      - branch: node-plan
        options:
          plan-1: [plan1-buy-vps, plan1-free-residential-ip, ssh-connect, run-script]
          plan-2: [plan2-buy-residential-vps, ssh-connect, run-script]
          plan-3: [plan3-buy-node]
  # 电脑代理软件选择页是 F1 的汇合点。
  - id: desktop-proxy
    title: 二、电脑代理
    items:
      - choose: desktop-proxy
      - branch: desktop-proxy
        options:
          v2rayn: [v2rayn-import, v2rayn-tun]
          clash-verge: [clash-verge-import, clash-verge-tun]
  # F2 跨两章：DNS 随软件不同，WebRTC 是 F2 的汇合点。
  - id: leak-protection
    title: 三、防泄漏
    items:
      - branch: desktop-proxy
        options:
          v2rayn: [v2rayn-dns]
          clash-verge: [clash-verge-dns]
      - webrtc
      - ipv6
  - id: desktop-timezone
    title: 四、电脑改时区
    items: [desktop-timezone]
  - id: ip-quality
    title: 五、检查 IP 质量
    items: [check-ip-quality]
