# 路线图：章节、分叉点、页面顺序和旁支页的唯一来源（架构 §3 M1/M2、需求 §5.2）。
# 页面标识是 principle/<id>.md 的文件名，也是 URL /<id>/；v2.0 发布后不能改（ADR-0002）。
# 选择页可写 default：本机没选时按这个选项计算导航和目录（节点方案默认方案二）；没有 default 的分叉点没选时，
# 它的分支段两侧的页面指向它的选择页（FR-13）。
# 章节的 summary 是首页五栏简介的文案（作者 2026-10-22 决定）：不是导入的正文，作者可以直接改这几句。
# v3（2026-10-22，实施计划 §3.1）：作者的新稿一章一页，11 页、5 章、2 个分叉点；方案一/二和 iPhone/安卓
# 各自放在同一章下面，分叉段的汇合点是下一章的第一页（选择页或普通页）。
chapters:
  - id: start
    title: 开始
    summary: 先弄清这份教程怎么用、要准备什么，再决定走哪条路。
    items: [preface]
  - id: node-and-ip
    title: 准备节点和住宅 IP
    summary: 两条路让 Claude 看到独享的住宅 IP：自己搭代理节点，或者直接买住宅服务器。
    items:
      - { choose: node-plan, page: overview, default: plan-2 }
      - branch: node-plan
        options:
          plan-1: [plan1]
          plan-2: [plan2-residential-server]
  - id: client-and-subscribe
    title: 客户端配置与订阅
    summary: 把节点接到电脑和手机上，再一步步注册账号、完成订阅。
    items:
      - { choose: phone, page: client-desktop }
      - branch: phone
        options:
          iphone: [iphone-prepare, iphone-subscription]
          android: [android-prepare, android-subscription]
  - id: maintenance
    title: 日常维护
    summary: 订阅之后怎么用、怎么续费，账号受限和常见故障怎么处理。
    items: [maintenance]
  - id: ending
    title: 结尾
    summary: 后记与致谢：这一路走下来的一些话。
    items: [afterword]
# 旁支页：不在序列里，页脚是“回到：<returnTo>”和 returnTo 的下一步（FR-19）。v3 没有旁支页。
side: {}
# 跳转表：被合并掉或删掉的旧网址 → 目标页（可写 section 指名目标页正文里的一个小节），旧地址仍然生成一个跳转页
# （FR-25、ADR-0006）。旧标识不能再分给新页面，也不进目录、搜索和 sitemap。
moved:
  # 2026-10-19 作者改用方案二，删掉方案一的“一、白嫖 ISP”，旧地址跳到方案一和方案二的对比（V10 换成新页面）
  plan1-free-isp: { to: overview, section: "方案一和方案二" }
  # 前言和整体思路：免责声明、清理旧账号、方案三（V11、实施计划 §3.1）
  disclaimer: { to: preface, section: "免责声明" }
  clean-up: { to: overview, section: "清理旧账号和配置" }
  choose-plan: { to: overview, section: "接下来怎么选" }
  plan3-residential-node: { to: overview, section: "为什么不推荐直接买住宅节点" }
  # 方案一：旧稿的四页并进 plan1 的四个 h2（V11）
  plan1-buy-server: { to: plan1, section: "购买海外 VPS" }
