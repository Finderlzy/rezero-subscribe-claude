  </g>
  <g fill="currentColor" font-family="system-ui, sans-serif" font-size="14">
    <text x="0" y="10" font-weight="700" dominant-baseline="central">你是谁</text>
    <text x="59" y="44" text-anchor="middle" dominant-baseline="central">Google 账号</text>
    <text x="164" y="30" text-anchor="middle" dominant-baseline="central">注册、登录</text>
    <text x="0" y="96" font-weight="700" dominant-baseline="central">从哪来</text>
    <text x="43" y="130" text-anchor="middle" dominant-baseline="central">手机/电脑</text>
    <text x="164" y="130" text-anchor="middle" dominant-baseline="central">住宅 IP</text>
    <text x="285" y="130" text-anchor="middle" dominant-baseline="central">claude.ai</text>
    <text x="0" y="168" dominant-baseline="central">设备上开着 tun 和分流</text>
