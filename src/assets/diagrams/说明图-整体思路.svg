<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 380">
<title>几个账号和环节的关系</title>
<desc>你是谁：用 Google 账号注册、登录 claude 账号。从哪来：手机和电脑开着 tun 和分流，经住宅 IP 访问 claude.ai，注册、使用、订阅全程都走这条线。谁付钱：用支付宝买礼品卡，充值到美区 Apple ID 余额，在 claude iOS app 里升级、用余额付款，订阅加到你的 claude 账号上。</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
